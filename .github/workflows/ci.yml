name: CI

# 与 npm-publish.yml 分开：那条只在 main 上跑发布，这条对每次 push / PR 做校验。
# 改造前只有发布流水线，PR 阶段没有任何护栏——冒烟测试是在发版那一刻才跑的。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 先把召回引擎装上，让下面每一步都在「与真实机器一致」的条件下跑：
      # 冒烟里有断言走的是「zg 在场」那条分支（例如未建索引时提示 `nx-kn index`），
      # 缺 zg 时会走到「先装 zg」的提示；smoke 里那条 Windows 引号回归也会被跳过。
      - name: 安装召回引擎 zg
        run: npm install -g @zvec/zvec-grep@0.2.2

      - name: Lint（含分层约束）
        run: pnpm run lint

      - name: 单元测试与一致性断言
        run: pnpm run test:unit

      - name: 构建前端
        run: pnpm run build

      - name: 端到端冒烟
        run: pnpm run test:smoke

      # 全链路流水线：从「skill 安装」一路走到「检索命中并读到原文」。
      # 冒烟测试刻意不起 zg，所以「加目录 → 建索引 → 检索」这条主干一直是
      # 只在开发者本机验证过的；这一步把它搬进 CI，让每一步都有护栏。
      - name: 全链路流水线（skill 安装 → 建库 → 建索引 → 检索 → 增量 → 多库）
        run: pnpm run test:pipeline
        env:
          # 用最小的 model2vec 模型，避免每次 CI 拉 600 MB 的默认模型；
          # 它只影响「用哪个模型」，不影响这条链路的每一步是否成立。
          NX_KN_PIPELINE_MODEL: local/potion-code-16m-v2
